name: Personal Website Workflows

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_REGISTRY: git.akmalmaulana.net
  USER_REGISTRY: ${{ secrets.USER_AKMAL }}
  TOKEN_REGISTRY: ${{ secrets.TOKEN_AKMAL }}

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: https://github.com/actions/checkout@v3

      - name: Log in to Registry
        uses: https://github.com/docker/login-action@v2
        with:
          username: ${{ env.USER_REGISTRY }}
          password: ${{ env.TOKEN_REGISTRY }}
          registry: ${{ env.IMAGE_REGISTRY }}

      - name: Build Image
        id: build-image
        uses: https://github.com/docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_REGISTRY}}/akmalm007/personal-website:latest

      - name: Deploy
        id: deployments
        env:
          KUBE_TOKEN: ${{ secrets.KUBE_TOKEN }}
          KUBE_CA_CERT: ${{ secrets.KUBE_CA_CERT }}
          KUBE_API_SERVER: ${{ secrets.KUBE_API_SERVER }}
        run: |
          KUBECTL_VERSION="v1.36.2"
          curl --connect-timeout 10 --max-time 60 --retry 3 -sLO \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x kubectl
          mv kubectl /usr/local/bin/kubectl

          # Build kubeconfig from secrets - no SSH, no key files, just an API call
          echo "$KUBE_CA_CERT" | base64 -d > /tmp/ca.crt
          kubectl config set-cluster k3s \
            --server="$KUBE_API_SERVER" \
            --certificate-authority=/tmp/ca.crt \
            --embed-certs=true
          kubectl config set-credentials forgejo-deploy --token="$KUBE_TOKEN"
          kubectl config set-context deploy \
            --cluster=k3s \
            --user=forgejo-deploy \
            --namespace=production
          kubectl config use-context deploy

          kubectl rollout history deployment/personal-website
