name: Personal Website Workflows

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_REGISTRY: git.akmalmaulana.net
  USER_REGISTRY: ${{ secrets.USER_AKMAL }}
  TOKEN_REGISTRY: ${{ secrets.TOKEN_AKMAL }}
  IMAGE_NAME: git.akmalmaulana.net/akmalm007/blog
  CONFIG_REPO: akmalm007/homelab
  CONFIG_PATH: k8s-cluster-config/apps/blog/overlays/production

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout blog code
        uses: https://github.com/actions/checkout@v3

      - name: Set short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to Registry
        uses: https://github.com/docker/login-action@v2
        with:
          username: ${{ env.USER_REGISTRY }}
          password: ${{ env.TOKEN_REGISTRY }}
          registry: ${{ env.IMAGE_REGISTRY }}

      - name: Build and push image
        uses: https://github.com/docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}

      - name: Checkout config repo
        uses: https://github.com/actions/checkout@v3
        with:
          repository: ${{ env.CONFIG_REPO }}
          token: ${{ env.TOKEN_REGISTRY }}
          path: homelab

      - name: Install kustomize
        run: |
          curl -sfL https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh \
            | bash -s -- 5.4.3 /usr/local/bin

      - name: Bump image tag
        working-directory: homelab/${{ env.CONFIG_PATH }}
        run: |
          kustomize edit set image ${{ env.IMAGE_NAME }}=${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}

      - name: Commit and push
        working-directory: homelab
        run: |
          git config user.name "forgejo-actions"
          git config user.email "actions@akmalmaulana.net"
          git add ${{ env.CONFIG_PATH }}/kustomization.yaml
          git diff --cached --quiet && echo "No changes, skipping" && exit 0
          git commit -m "deploy(blog): ${{ steps.vars.outputs.sha_short }}"
          git push origin main
